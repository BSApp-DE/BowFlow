name: Prüfung

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements.txt
      - name: Spezifikation auf Konsistenz prüfen
        run: python tools/validate.py
      - name: Konformitätsprüfung gegen die Referenz (Selbsttest)
        run: python tools/check.py selftest
