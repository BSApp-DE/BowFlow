openapi: 3.1.0
info:
  title: BowFlow Interop API – Kern
  version: 1.0.0-draft
  description: Beitritt und Benachrichtigungen. Gilt für jedes Profil. Die Objekte und ihre Pfade legt das Profil
    fest.
servers:
- url: '{base_url}/interop/v1'
  variables:
    base_url:
      default: https://league.example.org
paths:
  /join:
    post:
      summary: Mit dem 6-stelligen Code beitreten
      tags:
      - Beitritt
      description: Einmaliger Code, 30 Minuten gültig. Antwort enthält Token (gilt bis Tagesende) und Webhook-Geheimnis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/join.schema.json#/$defs/JoinRequest
      responses:
        '201':
          description: Beigetreten
          content:
            application/json:
              schema:
                $ref: ../schemas/join.schema.json#/$defs/JoinResponse
        '401':
          description: Code ungültig, abgelaufen oder bereits benutzt (zählt als Fehlversuch)
          content: &id001
            application/json:
              schema:
                $ref: ../schemas/problem.schema.json
        '429':
          description: Zu viele Fehlversuche, später erneut versuchen
          content: *id001
webhooks:
  notification:
    post:
      summary: Benachrichtigung der Verwaltungs-App an eine verbundene App
      description: 'Gesendet an die beim Beitritt angegebene `webhook_url`. Nie an die App, die die Änderung geschrieben
        hat. Header `X-Interop-Signature: sha256=<HMAC-SHA256 des Bodys mit dem webhook_secret, hexadezimal>`. Antwort
        `2xx` quittiert; sonst Wiederholung nach 5 s, 30 s, 2 min, 10 min, 30 min, 1 h.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/notification.schema.json
      responses:
        '200':
          description: Angenommen
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token aus dem Beitritt; gilt bis zum Ende des Wettkampftags.
