openapi: 3.1.0
info:
  title: BowFlow API – Profil league
  version: 1.0.0-draft
  description: Objekte des Profils `league` (Liga-Wettkämpfe). Beitritt und Webhook stehen im Kern. Alles läuft
    über die Liga App.
servers:
- url: '{base_url}/bowflow/v1'
  variables:
    base_url:
      default: https://league.example.org
paths:
  /events/{event_id}/snapshot:
    get:
      summary: Alle geteilten Objekte auf einmal
      description: Für Start, Verbindungsabriss, Lücke in der Laufnummer und das 60-Sekunden-Sicherheitsnetz.
        `since`, `304` und das Verwerfen wartender Benachrichtigungen regelt der Kern.
      security: &id001
      - bearerAuth: []
      parameters:
      - &id002
        $ref: '#/components/parameters/EventId'
      - $ref: ../../../core/api/openapi.yaml#/components/parameters/Since
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/snapshot.schema.json
        '304':
          $ref: ../../../core/api/openapi.yaml#/components/responses/NotModified
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
      - Objekte
  /events/{event_id}/schedule:
    get:
      summary: Spielplan (nur lesen)
      security: *id001
      parameters:
      - *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/schedule.schema.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
      - Objekte
  /events/{event_id}/teams/{team_id}/roster:
    get:
      summary: Schützenliste einer Mannschaft (nur lesen)
      tags:
      - Objekte
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/roster.schema.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /events/{event_id}/state:
    get:
      summary: Freigabe-Stand lesen
      security: *id001
      parameters:
      - *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/event-state.schema.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
      - Objekte
    put:
      summary: Freigabe-Stand schreiben
      description: Ersetzt den Stand vollständig; der letzte Schreibzugriff gilt.
      security: *id001
      parameters:
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/event-state.schema.json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/event-state.schema.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      tags:
      - Objekte
  /events/{event_id}/scoresheets/{scoresheet_id}/lineup:
    get:
      summary: Meldung lesen
      security: *id001
      parameters:
      - *id002
      - &id003
        $ref: '#/components/parameters/ScoresheetId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/lineup.schema.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
      - Objekte
    put:
      summary: Meldung schreiben
      security: *id001
      parameters:
      - *id002
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/lineup.schema.json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/lineup.schema.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      tags:
      - Objekte
    delete:
      summary: Meldung zurücksetzen
      description: Der Kampfrichter setzt die Meldung zurück, solange noch keine Pfeilwerte erfasst sind.
      security: *id001
      parameters:
      - *id002
      - *id003
      responses:
        '204':
          description: Zurückgesetzt
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
      - Objekte
  /events/{event_id}/scoresheets/{scoresheet_id}/provisional-sets/{set_number}:
    get:
      summary: Vorläufigen Satz lesen
      security: *id001
      parameters:
      - *id002
      - *id003
      - &id004
        $ref: '#/components/parameters/SetNumber'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/provisional-set.schema.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
      - Objekte
    put:
      summary: Vorläufigen Satz schreiben
      security: *id001
      parameters:
      - *id002
      - *id003
      - *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/provisional-set.schema.json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/provisional-set.schema.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      tags:
      - Objekte
  /events/{event_id}/scoresheets/{scoresheet_id}/official-sets/{set_number}:
    get:
      summary: Offiziellen Satz lesen
      security: *id001
      parameters:
      - *id002
      - *id003
      - *id004
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/official-set.schema.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
      - Objekte
    put:
      summary: Offiziellen Satz schreiben
      description: Fixiert den Satz. Die Liga rechnet danach neu.
      security: *id001
      parameters:
      - *id002
      - *id003
      - *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/official-set.schema.json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/official-set.schema.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      tags:
      - Objekte
  /events/{event_id}/scoresheets/{scoresheet_id}/shoot-off:
    get:
      summary: Stechen lesen
      security: &id005
      - bearerAuth: []
      parameters:
      - &id006
        $ref: '#/components/parameters/EventId'
      - &id007
        $ref: '#/components/parameters/ScoresheetId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/shoot-off.schema.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
      - Objekte
    put:
      summary: Stechen schreiben
      security: *id005
      parameters:
      - *id006
      - *id007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/shoot-off.schema.json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/shoot-off.schema.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      tags:
      - Objekte
    delete:
      summary: Stechen zurücksetzen
      description: Der Kampfrichter setzt die Meldung zurück, solange noch keine Pfeilwerte erfasst sind.
      security: *id005
      parameters:
      - *id006
      - *id007
      responses:
        '204':
          description: Zurückgesetzt
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
      - Objekte
  /events/{event_id}/scoresheets/{scoresheet_id}/results:
    get:
      summary: Ergebnisse eines Schusszettels (nur lesen)
      security: *id001
      parameters:
      - *id002
      - *id003
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/results.schema.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
      - Objekte
  /events/{event_id}/standings:
    get:
      summary: Tabelle (nur lesen)
      security: *id001
      parameters:
      - *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/standings.schema.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
      - Objekte
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token aus dem Beitritt; gilt bis zum Ende des Wettkampftags.
  parameters:
    EventId:
      name: event_id
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    ScoresheetId:
      name: scoresheet_id
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    SetNumber:
      name: set_number
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 5
    TeamId:
      name: team_id
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
  responses:
    Unauthorized:
      description: Token fehlt oder ist ungültig
      content:
        application/json:
          schema:
            $ref: ../../../core/schemas/problem.schema.json
    Forbidden:
      description: Objekt ist für verbundene Apps nur lesbar, oder die Aktion ist außerhalb des erlaubten Zeitfensters
      content:
        application/json:
          schema:
            $ref: ../../../core/schemas/problem.schema.json
    NotFound:
      description: Nicht gefunden
      content:
        application/json:
          schema:
            $ref: ../../../core/schemas/problem.schema.json
    ValidationFailed:
      description: Objekt entspricht nicht dem Schema
      content:
        application/json:
          schema:
            $ref: ../../../core/schemas/problem.schema.json
