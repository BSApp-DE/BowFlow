# Baut die Markdown-Doku (README, GOVERNANCE, core/docs, profiles/*/docs) als Website.
# docs_dir ist das Repo selbst: Die relativen Links zwischen den Dateien bleiben so gültig,
# und .json-Schemas/Beispiele werden als statische Dateien mitgeliefert.
# Neue Profile erscheinen automatisch in der Navigation.
site_name: BowFlow Spezifikation
docs_dir: ..
use_directory_urls: true
exclude_docs: |
  /tools/*
  !/tools/theme/
  /.github/
  /_site/
  /.venv/
  /node_modules/
theme:
  name: material
  language: de
  font: false
  logo: tools/theme/logo.png
  favicon: tools/theme/logo.png
  features:
    - navigation.sections
    - content.code.copy
extra_css:
  - tools/theme/bsapp.css
extra:
  generator: false
markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
